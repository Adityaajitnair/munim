services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: munimai
      POSTGRES_PASSWORD: munimai
      POSTGRES_DB: munimai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8ndata:/home/node/.n8n

volumes:
  pgdata:
  n8ndata:
